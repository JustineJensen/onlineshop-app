# Database Configuration - Local PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

# Hibernate behaviour
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.datasource.initialization.mode=always
spring.jpa.defer-datasource-initialization=true

#Enable logging of SQL
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace

#Debugging
logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.security=DEBUG

#Server Port
server.port=8081

## configs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://localhost:8080/realms/storeproject/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URL:http://localhost:8080/realms/storeproject}
spring.security.keycloak.realm=storeproject
spring.security.keycloak.resource=storeproject
spring.security.keycloak.credentials.secret=${CLIENT_SECRET:client-secret}
spring.security.keycloak.ssl-required=external
spring.security.keycloak.client-id=${CLIENT_ID:store-client}
spring.security.jwt.auth.converter.resource-id=${CLIENT_ID:store-client}
#spring.security.jwt.auth.converter.principal-attribute=preferred_username


